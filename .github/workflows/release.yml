# Builds the installer and publishes a GitHub Release when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# Installed apps pick up the new release automatically (Velopack, see AppUpdater.cs).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload assets

env:
  PACK_ID: ZendeskWatcherApp # also the install folder: %LOCALAPPDATA%\ZendeskWatcherApp. Never change it.
  VPK_VERSION: 1.2.161       # keep in step with the Velopack package in ZendeskWatcher.csproj

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish
        run: dotnet publish ZendeskWatcher.csproj -c Release -r win-x64 --self-contained -p:Version=${{ env.VERSION }} -o publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # The previous release is needed to build a small delta update from it.
      - name: Download previous release
        continue-on-error: true # nothing to download for the first release; then there's just no delta
        run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o Releases

      - name: Pack
        run: >
          vpk pack -u ${{ env.PACK_ID }} -v ${{ env.VERSION }} -p publish -e ZendeskWatcher.exe
          --packTitle "Zendesk Watcher" --packAuthors "Optimizely" -i Assets/app.ico -o Releases

      - name: Upload release
        run: >
          vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          -o Releases --publish --tag ${{ github.ref_name }} --releaseName "Zendesk Watcher ${{ env.VERSION }}"
