# Builds the installer and publishes a GitHub Release when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# Installed apps pick up the new release automatically (Velopack, see AppUpdater.cs).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload assets

env:
  PACK_ID: ZendeskWatcherApp # also the install folder: %LOCALAPPDATA%\ZendeskWatcherApp. Never change it.
  VPK_VERSION: 1.2.161       # keep in step with the Velopack package in ZendeskWatcher.csproj

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Framework-dependent keeps the installer small (~17 MB instead of ~65 MB). Setup installs the
      # .NET Desktop Runtime and WebView2 when they're missing (see --framework below).
      - name: Publish
        run: dotnet publish ZendeskWatcher.csproj -c Release -r win-x64 --self-contained false -p:Version=${{ env.VERSION }} -o publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # The previous release is needed to build a small delta update from it.
      - name: Download previous release
        continue-on-error: true # nothing to download for the first release; then there's just no delta
        run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o Releases

      # This version's section of CHANGELOG.md ("## 1.2.0 ..." up to the next "## "), plus a link to the
      # install guide. Shown on the GitHub release and (first bullets) in the app's "Update ready" notification.
      - name: Release notes
        shell: bash
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v "( |$)" { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning::CHANGELOG.md has no section for $VERSION"
            echo "Maintenance release." > notes.md
          fi
          printf '\n---\nNew to Zendesk Watcher? See the [install guide](%s/%s/blob/main/INSTALL.md).\n' \
            "${{ github.server_url }}" "${{ github.repository }}" >> notes.md
          cat notes.md

      - name: Pack
        run: >
          vpk pack -u ${{ env.PACK_ID }} -v ${{ env.VERSION }} -r win-x64 -p publish -e ZendeskWatcher.exe
          --framework net10-x64-desktop,webview2 --releaseNotes notes.md
          --packTitle "Zendesk Watcher" --packAuthors "Optimizely" -i Assets/app.ico -o Releases

      - name: Upload release
        run: >
          vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          -o Releases --publish --tag ${{ github.ref_name }} --releaseName "Zendesk Watcher ${{ env.VERSION }}"

      # Make sure the release page shows the notes, whatever vpk put there.
      - name: Release page notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --notes-file notes.md
