# Builds the Mac test app (ZendeskWatcher.Mac) on a macOS runner: Mac apps can only be built on a Mac.
# The result is a zip with "Zendesk Watcher.app" (Apple silicon + Intel, ad-hoc signed, no Apple account) under the
# run's Artifacts, and (from the mac branch) as the "mac-preview" pre-release for testers.
name: Mac test build

permissions:
  contents: write # the mac-preview pre-release

on:
  push:
    branches: [main, mac]
    paths: ['ZendeskWatcher.Mac/**', 'Core/**', '.github/workflows/mac.yml']
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The .NET macOS workload needs the newest Xcode; the runner's default can be older.
      - name: Use the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Install the macOS workload
        run: dotnet workload install macos

      - name: Build
        env:
          DEFAULT_SUBDOMAIN: ${{ secrets.DEFAULT_SUBDOMAIN }}
        # Errors are repeated as annotations: those can be read without signing in to GitHub (the logs can't).
        run: |
          set -o pipefail
          dotnet build ZendeskWatcher.Mac/ZendeskWatcher.Mac.csproj -c Release "-p:DefaultSubdomain=$DEFAULT_SUBDOMAIN" 2>&1 | tee build.log || {
            grep -E "error|Error|ILLink|IL[0-9]{4}|MT[0-9]{4}" build.log | grep -v "warning" | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Zip the app
        run: |
          find ZendeskWatcher.Mac/bin -name "*.app" -type d -prune | while IFS= read -r a; do echo "::notice::Found: $a ($(lipo -archs "$a/Contents/MacOS/"* 2>/dev/null | head -1))"; done
          # The universal app (Apple silicon + Intel) sits directly in net10.0-macos; else the Apple silicon one.
          app=$(ls -d ZendeskWatcher.Mac/bin/Release/net10.0-macos/*.app 2>/dev/null | head -1)
          [ -n "$app" ] || app=$(ls -d ZendeskWatcher.Mac/bin/Release/net10.0-macos/osx-arm64/*.app 2>/dev/null | head -1)
          if [ -z "$app" ]; then
            echo "::error::No app found: $(find ZendeskWatcher.Mac/bin -maxdepth 4 | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice::Using: $app ($(lipo -archs "$app/Contents/MacOS/"* | head -1))"
          mkdir -p out
          ditto "$app" "out/Zendesk Watcher.app"
          ditto -c -k --keepParent "out/Zendesk Watcher.app" ZendeskWatcher-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ZendeskWatcher-mac
          path: ZendeskWatcher-mac.zip

      # A fixed download link for testers: the "mac-preview" pre-release, replaced by every build of the mac branch.
      # Installed Windows apps only look at full releases, so they never see it.
      - name: Publish the Mac preview
        if: github.ref == 'refs/heads/mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "**Test version for Mac, not a release.** Menu bar icon with the unassigned count, macOS notifications, groups in the menu."
            echo
            echo "Install: download **ZendeskWatcher-mac.zip**, double-click it, and drag **Zendesk Watcher** to Applications. The app isn't signed by Apple yet, so the first start is blocked: open **System Settings → Privacy & Security**, scroll down to the message about Zendesk Watcher and click **Open Anyway**, then confirm. After that it starts normally."
            echo
            echo "Then click the ticket icon in the menu bar: Zendesk account… → Sign in… → Groups to watch. Feedback: menu → Send feedback…"
          } > preview-notes.md
          gh release delete mac-preview --yes --cleanup-tag || true
          gh release create mac-preview ZendeskWatcher-mac.zip --prerelease --target "$GITHUB_SHA" \
            --title "Zendesk Watcher for Mac (test version, $(date -u +%Y-%m-%d))" --notes-file preview-notes.md
